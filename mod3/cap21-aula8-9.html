        <title>Tabelas</title>



        <style>

                body {

                    font-family: Arial, Helvetica, sans-serif;
                    font-weight: bold;
                    background-color: rgba(209, 170, 119, 0.295);

}

                body h1, body h3 {

                    text-align: center;
                    color: rgb(243, 74, 8);

}

                table {

                    margin: auto;
                    text-align: center;
                    width: 500px;
                    border-collapse: collapse;
                    position: relative;

}

                td , th {

                    border: 1px solid black;
                    padding: 10px;

}

                caption {
                    
                    font-size: 1.5em;
                    font-weight: bold;
                    padding: 10px;
                    background-color: rgba(255, 255, 0, 0.459);
}

                thead, tfoot {

                    background-color: rgb(17, 17, 17);
                    color: white;

}

                thead > tr > th {

                    position: sticky;
                    top: -1px;
                    background-color: black;

                }

                tbody > tr:nth-child(odd) {

                    background-color: rgb(241, 8, 8);

}

                tbody > tr:nth-child(even) {

                    background-color: rgb(255, 208, 0);

}


                aside {

                    background-color: rgba(0, 0, 0, 0.404);
                    border-radius: 10px;
                    width: 80%;
                    padding: 15px;
                    margin: 0 auto 20px auto;
                    text-align: justify;
                    box-shadow: 20px;

}


                .botao {

                    width: 120px;
                    display: block;
                    margin: 20px auto;
                    padding: 5px;
                    background-color: brown;
                    text-decoration: none;
                    text-align: center;
                    border: 3px solid black;
                    text-shadow: 5px;

                }
